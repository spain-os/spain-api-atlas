# Etiqueta cada issue según su nivel, lo cuelga de su padre ("Padre: #N" en el cuerpo)
# y aplica los tags del registro (labels cat:, auth:, fmt:, tipo:, amb:) a partir de la ficha.
# Los agentes sin permisos no pueden poner labels ni crear sub-issues; esto lo hace por ellos.
name: enlazar
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  enlazar:
    runs-on: ubuntu-latest
    env:
      # Todo lo que viene del issue entra por env, nunca con ${{ }} dentro de run: (inyección de comandos)
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
      ID: ${{ github.event.issue.id }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.issue.body }}
      OLD_BODY: ${{ github.event.changes.body.from }}
      BODY_CHANGED: ${{ github.event.changes.body != null }}
      ACTION: ${{ github.event.action }}
    steps:
      - run: |
          case "$TITLE" in
            "[organismo]"*) nivel=organismo; padre_nivel=ambito ;;
            "[api]"*)       nivel=api;       padre_nivel=organismo ;;
            *) exit 0 ;;
          esac
          [ "$ACTION" = edited ] && [ "$BODY_CHANGED" != true ] && exit 0
          [ "$ACTION" = opened ] && gh issue edit "$N" --add-label "$nivel"

          body=$(printf '%s\n' "$BODY" | tr -d '\r')
          padre_de() { printf '%s\n' "$1" | tr -d '\r' | grep -oiP '^\s*padre:\s*#\K\d+' | head -1 || true; }
          padre=$(padre_de "$BODY")
          errores=""
          err() { errores+="- $1"$'\n'; }

          # 1. Padre: comprobar nivel y colgar (solo si es nuevo o ha cambiado)
          padre_labels=""
          if [ -z "$padre" ]; then
            err "Falta \`Padre: #N\` en la primera línea del cuerpo."
          else
            padre_labels=$(gh issue view "$padre" --json labels -q '.labels[].name' 2>/dev/null || true)
            if ! grep -qx "$padre_nivel" <<<"$padre_labels"; then
              err "#$padre no es un issue de tipo \`$padre_nivel\`. Un \`[$nivel]\` tiene que colgar de un \`$padre_nivel\`."
              padre_labels=""
            elif [ "$ACTION" = opened ] || [ "$padre" != "$(padre_de "$OLD_BODY")" ]; then
              gh api "repos/$GH_REPO/issues/$padre/sub_issues" -F sub_issue_id="$ID" -F replace_parent=true >/dev/null \
                || err "No he podido colgar este issue de #$padre (¿tiene ya 100 hijos?)."
            fi
          fi

          # 2. Tags: amb: se hereda del padre; el resto sale de la ficha (solo en [api])
          quiero=$(grep '^amb:' <<<"$padre_labels" || true)
          if [ "$nivel" = api ]; then
            ficha=$(awk '/^```ya?ml/{f=1;next} f&&/^```/{exit} f' <<<"$body")
            if [ -z "$ficha" ]; then
              err "Falta el bloque \`\`\`yaml con la ficha."
            elif ! tags=$(yq -r '"tipo:" + (.tipo // "api"), "cat:" + (.categoria // ""), "auth:" + (.auth // ""), ((.formato // [])[] | "fmt:" + .)' <<<"$ficha" 2>/dev/null); then
              err "La ficha no es YAML válido (ojo: \`formato\` es una lista, p. ej. \`[json]\`)."
            else
              quiero+=$'\n'"$tags"
            fi
          fi

          registro=$(gh label list -L 500 --json name -q '.[].name')
          validas=""
          while IFS= read -r l; do
            [ -z "$l" ] && continue
            if grep -qxF "$l" <<<"$registro"; then validas+="$l"$'\n'
            else err "\`$l\` no está en el [registro de tags](https://github.com/$GH_REPO/labels)."
            fi
          done <<<"$quiero"

          actuales=$(gh issue view "$N" --json labels -q '.labels[].name' | grep -E '^(amb|cat|auth|fmt|tipo):' || true)
          quitar=$(comm -23 <(sort -u <<<"$actuales") <(sort -u <<<"$validas") | grep -v '^$' | paste -sd, - || true)
          poner=$(comm -13 <(sort -u <<<"$actuales") <(sort -u <<<"$validas") | grep -v '^$' | paste -sd, - || true)
          [ -n "$quitar" ] && gh issue edit "$N" --remove-label "$quitar"
          [ -n "$poner" ] && gh issue edit "$N" --add-label "$poner"

          if [ -n "$errores" ]; then
            gh issue comment "$N" --body "$(printf 'Hay que corregir esto (edita el cuerpo del issue y lo reviso de nuevo):\n\n%s\nVer [AGENTS.md](https://github.com/%s/blob/main/AGENTS.md).' "$errores" "$GH_REPO")"
          fi
          exit 0
